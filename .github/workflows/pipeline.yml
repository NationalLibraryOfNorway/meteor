name: CI/CD pipeline

on: [push]

env:
  APP_VERSION: ${{ github.ref_name }}

jobs:

  lint-and-test:
    name: Run linting, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test/requirements.txt

      - name: Linting
        run: |
          flake8 -v
          pylint metadata_extract src diff test *.py

      - name: Type-check
        run: mypy metadata_extract src diff main.py

      - name: Running tests
        run: python -m pytest --cov=metadata_extract

  build-and-publish:
    name: Create and push Docker image
    needs: lint-and-test
    # if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: NationalLibraryOfNorway/tekst-workflows/.github/workflows/docker-build-and-push.yml@main
    with:
      USE_HARBOR: false
      ENVIRONMENT: stage
    secrets:
      VAULT_URL: ${{ secrets.VAULT_URL }}
      VAULT_SECRET_PATH: ${{ secrets.VAULT_SECRET_PATH }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}


  deploy-to-stage:
    name: Deploy to kubernetes stage environment
    needs: build-and-publish
    # if: github.ref == 'refs/heads/main'
    uses: NationalLibraryOfNorway/tekst-workflows/.github/workflows/kubernetes-deploy.yml@main
    with:
      CLUSTER_NAME: hstk8s
      ENVIRONMENT: stage
      IMAGE_VERSION: ${{ needs.build-and-publish.outputs.image_version }}
    secrets:
      VAULT_URL: ${{ secrets.NB_VAULT_URL }}
      VAULT_SECRET_PATH: ${{ secrets.TEKST_VAULT_SECRET_PATH }}
      VAULT_ROLE_ID: ${{ secrets.TEKST_VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.TEKST_VAULT_SECRET_ID }}

  deploy-to-prod:
    name: Deploy to kubernetes prod environment
    needs: build-and-publish
    runs-on: [self-hosted-linux]
    if: startsWith(github.event.ref, 'refs/tags/v')
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Import secrets
        id: import-secrets
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.NB_VAULT_URL }}
          method: approle
          roleId: ${{ secrets.TEKST_VAULT_ROLE_ID }}
          secretId: ${{ secrets.TEKST_VAULT_SECRET_ID }}
          secrets: |
            /v1/secret/v1/application/k8s/tekst/data/hstk8s-text-prod *

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.26.5'

      - name: Set Version
        uses: actions/github-script@v7
        id: set_version
        with:
          script: |
            const no_v = context.ref.replace('refs/tags/v', '')
            core.setOutput('img_version', no_v)

      - name: Deploy to k8s
        run: |
          echo "Deploy version ${{ env.APP_VERSION }}" to prod
          kubectl config set-cluster k8s --server="${{ steps.import-secrets.outputs.K8S_SERVER }}"
          kubectl config set clusters.k8s.certificate-authority-data ${{ steps.import-secrets.outputs.K8S_CA }}
          kubectl config set-credentials ${{ steps.import-secrets.outputs.K8S_USER }} --token=${{ steps.import-secrets.outputs.K8S_TOKEN }}
          kubectl config set-context meteor --cluster=k8s --user=${{ steps.import-secrets.outputs.K8S_USER }} --namespace=tekst-prod
          kubectl config use-context meteor
          kubectl config view
          kubectl version
          sed -i "s/<pvc_claim_name>/dimo-file-server-pvc/g" k8s/meteor.yml
          sed -i "s/<version>/${{ steps.set_version.outputs.img_version }}/g" k8s/meteor.yml
          sed -i "s/<host_url>/${{ steps.import-secrets.outputs.K8S_HOST_URL }}/g" k8s/meteor.yml
          kubectl apply -f k8s/meteor.yml
          kubectl rollout restart deploy/meteor
